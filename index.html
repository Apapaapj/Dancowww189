<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>iPhone Camera Web</title>

<style>
body {
  margin:0;
  background:black;
  font-family:-apple-system;
  color:white;
  text-align:center;
}

video {
  width:100%;
  height:80vh;
  object-fit:cover;
  background:black;
}

.controls {
  position:fixed;
  bottom:20px;
  width:100%;
}

button {
  border:none;
  border-radius:50%;
  padding:15px;
  margin:8px;
}

#shutter {
  width:70px;
  height:70px;
  background:white;
}

.mode {
  background:rgba(255,255,255,0.2);
  color:white;
  padding:8px 14px;
  border-radius:20px;
}
</style>
</head>

<body>

<video id="video" autoplay playsinline></video>

<div class="controls">
  <button class="mode" onclick="setZoom(0.5)">0.5</button>
  <button id="shutter" onclick="takePhoto()"></button>
  <button class="mode" onclick="setZoom(1)">1x</button>
  <button class="mode" onclick="setZoom(2)">2x</button>
  <button class="mode" onclick="startLive()">LIVE</button>
</div>

<script>
let video = document.getElementById("video")
let stream
let zoom = 1

// START CAMERA (FIX BLACK SCREEN)
async function startCam(){
  try{
    stream = await navigator.mediaDevices.getUserMedia({
      video: true,
      audio: false
    })
    video.srcObject = stream
  }catch(e){
    alert("❌ Kamera gagal: " + e.message)
  }
}
startCam()

// ZOOM SIMULASI
function setZoom(z){
  zoom = z
  if(z === 0.5){
    video.style.transform = "scale(0.7)"
  }else if(z === 2){
    video.style.transform = "scale(1.5)"
  }else{
    video.style.transform = "scale(1)"
  }
}

// FOTO
function takePhoto(){
  let canvas = document.createElement("canvas")
  canvas.width = video.videoWidth
  canvas.height = video.videoHeight
  let ctx = canvas.getContext("2d")

  ctx.drawImage(video,0,0)

  let a = document.createElement("a")
  a.href = canvas.toDataURL("image/png")
  a.download = "foto.png"
  a.click()
}

// LIVE (VIDEO PENDEK)
function startLive(){
  let recorder = new MediaRecorder(stream)
  let data = []

  recorder.ondataavailable = e => data.push(e.data)

  recorder.onstop = () => {
    let blob = new Blob(data, {type:"video/webm"})
    let url = URL.createObjectURL(blob)

    let a = document.createElement("a")
    a.href = url
    a.download = "live.webm"
    a.click()
  }

  recorder.start()
  setTimeout(()=>recorder.stop(),2000)
}
</script>

</body>
</html>
